name: Node runtime qualification

on:
  pull_request:
    paths:
      - .github/workflows/node-runtime-qualification.yml
      - .npmrc
      - .node-version
      - AGENTS.md
      - README.md
      - test/fixtures/node26-locked-peers.mjs
      - architecture/foundation/docs-protocol-node26-qualification-v1.json
      - architecture/foundation/docs-protocol-managed-state.json
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - scripts/node26-public-packages/**
      - scripts/node26-public-package-probe.mts
      - scripts/lib/node26-canary-policy.mjs
      - scripts/node-api-compatibility-probe.mjs
      - scripts/node26-canary-qualification.mjs
      - test/node26-canary-policy.test.mjs
  workflow_dispatch:
    inputs:
      run_node24_production:
        description: Run the retained Node24 compatibility runner
        required: true
        type: boolean
        default: true
      run_node26_canary:
        description: Run managed Node26 candidate qualification (strict admission remains required)
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  node26-default:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.11.1
      - name: Prepare isolated Corepack and nested pnpm shims
        shell: bash
        run: |
          corepack_root=$(mktemp -d "${{ runner.temp }}/node-corepack.XXXXXX")
          selected_node=$(command -v node)
          mkdir -p "$corepack_root/tmp"
          export TMPDIR="$corepack_root/tmp"
          npm install --prefix "$corepack_root" --cache "$corepack_root/npm-cache" --ignore-scripts --no-audit --no-fund corepack@0.36.0
          corepack_js="$corepack_root/node_modules/corepack/dist/corepack.js"
          mkdir -p "$corepack_root/bin" "$corepack_root/tmp"
          printf '#!/bin/sh\nexec "%s" "%s" "$@"\n' "$selected_node" "$corepack_js" > "$corepack_root/bin/corepack"
          printf '#!/bin/sh\nexec "%s" "%s" pnpm "$@"\n' "$selected_node" "$corepack_js" > "$corepack_root/bin/pnpm"
          chmod +x "$corepack_root/bin/corepack" "$corepack_root/bin/pnpm"
          {
            echo "COREPACK_JS=$corepack_js"
            echo "COREPACK_HOME=$corepack_root/home"
            echo "PNPM_HOME=$corepack_root/pnpm-home"
            echo "XDG_CACHE_HOME=$corepack_root/cache"
            echo "npm_config_cache=$corepack_root/npm-cache"
            echo "TMPDIR=$corepack_root/tmp"
          } >> "$GITHUB_ENV"
          echo "$corepack_root/bin" >> "$GITHUB_PATH"
      - name: Real parser and admission regressions
        shell: bash
        run: |
          policy_tools_root=$(mktemp -d "${{ runner.temp }}/node-policy-tools.XXXXXX")
          trap 'rm -rf -- "$policy_tools_root"' EXIT
          cp scripts/node26-public-packages/manifest.json "$policy_tools_root/package.json"
          cp scripts/node26-public-packages/locked-dependencies.yaml "$policy_tools_root/pnpm-lock.yaml"
          cp scripts/node26-public-packages/pnpm-workspace.yaml.in "$policy_tools_root/pnpm-workspace.yaml"
          corepack pnpm --dir "$policy_tools_root" install --frozen-lockfile --ignore-scripts --ignore-pnpmfile --engine-strict --strict-peer-dependencies --package-import-method=copy --store-dir "$policy_tools_root/store"
          NODE26_POLICY_TOOLS="$policy_tools_root" node --test test/node26-canary-policy.test.mjs
      - run: node scripts/node26-canary-qualification.mjs --mode production --work-root "${{ runner.temp }}/node26-default-${{ github.run_id }}-${{ github.run_attempt }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: node26-default-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/node26-default-${{ github.run_id }}-${{ github.run_attempt }}/evidence
          retention-days: 14
          if-no-files-found: warn

  node24-production:
    if: github.event_name == 'pull_request' || inputs.run_node24_production
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
      - name: Prepare isolated Corepack and nested pnpm shims
        shell: bash
        run: |
          corepack_root=$(mktemp -d "${{ runner.temp }}/node-corepack.XXXXXX")
          selected_node=$(command -v node)
          mkdir -p "$corepack_root/tmp"
          export TMPDIR="$corepack_root/tmp"
          npm install --prefix "$corepack_root" --cache "$corepack_root/npm-cache" --ignore-scripts --no-audit --no-fund corepack@0.36.0
